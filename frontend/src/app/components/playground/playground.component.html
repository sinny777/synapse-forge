<app-page-wrapper>
  <!-- Page Header -->
  <app-page-header
    title="Playground"
    [subtitle]="activeWorkspace ? activeWorkspace.name : undefined"
    [breadcrumbs]="[{label: 'Resource list', route: '/'}, {label: 'Playground'}]">
    <div actions>
      <!-- Orchestration Selector -->
      <div class="orch-selector">
        <span class="selector-label">Orchestration:</span>
        <cds-dropdown
          placeholder="Select orchestration"
          [appendInline]="true"
          size="sm"
          (selected)="onOrchestrationSelect($event)">
          <cds-dropdown-list [items]="orchestrationDropdownItems"></cds-dropdown-list>
        </cds-dropdown>
      </div>
    </div>
  </app-page-header>

  <!-- Page Content (Full Width for Chat Layout) -->
  <div class="page-content-full">
    <!-- Notification -->
    <div *ngIf="notification" class="notification-wrapper">
    <cds-inline-notification [notificationObj]="{
        type: notification.type,
        title: notification.title,
        message: notification.message,
        lowContrast: true
      }" (close)="dismissNotification()">
    </cds-inline-notification>
  </div>

  <!-- No workspace -->
  <div *ngIf="!activeWorkspace" class="empty-state">
    <h3>No Workspace Selected</h3>
    <p>Select a workspace and an orchestration to start chatting.</p>
  </div>

  <div *ngIf="activeWorkspace" class="playground-body">
    <app-execution-chat
      [title]="'Playground'"
      [emptyTitle]="'Start a conversation'"
      [emptyDescription]="'Select an orchestration above and type a message to execute your workflow.'"
      [placeholder]="selectedOrchestrationId ? 'Type a message...' : 'Select an orchestration first...'"
      [disabled]="!selectedOrchestrationId"
      [showTrace]="showTrace"
      [isExecuting]="isExecuting"
      [messages]="messages"
      [traceEvents]="traceEvents"
      [userInput]="userInput"
      [context]="executionContext"
      (userInputChange)="userInput = $event"
      (send)="sendMessage()"
      (clear)="clearChat()"
      (toggleTrace)="toggleTrace()"
      (stop)="stopExecution()">
    </app-execution-chat>
  </div>
  </div>
</app-page-wrapper>
