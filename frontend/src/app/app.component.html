<!-- Carbon UI Shell: Top Header -->
<cds-header name="SynapseForge" [brand]="''" *ngIf="currentRoute !== '/login'" data-carbon-theme="g100">
  <cds-hamburger [active]="sidenavExpanded" (selected)="toggleSidenav()"></cds-hamburger>

  <!-- Navigation area -->
  <cds-header-navigation>
    <!-- Workspace Switcher in Header -->
    <cds-header-item *ngIf="activeWorkspace" style="cursor: default; pointer-events: none;">
      <span style="font-size: 0.75rem; color: var(--cds-text-secondary, #a8a8a8);">Workspace:</span>
      &nbsp;
      <strong style="color: var(--cds-text-primary, #f4f4f4);">{{ activeWorkspace.name }}</strong>
    </cds-header-item>
  </cds-header-navigation>

  <cds-header-global>
    <!-- Workspace Switcher Dropdown -->
    <cds-header-action title="Switch Workspace" class="ws-switcher">
      <svg cdsIcon="switcher" size="16"></svg>
    </cds-header-action>

    <!-- Help button -->
    <cds-header-action title="Help">
      <svg cdsIcon="help" size="20"></svg>
    </cds-header-action>

    <!-- User Profile / Login — always rightmost before theme toggle -->
    <div *ngIf="authService.authState$ | async as auth" class="header-user-menu" style="position: relative; display: flex; align-items: center;">

      <!-- Not authenticated: text Login link -->
      <button *ngIf="!auth.isAuthenticated" class="header-login-link" (click)="navigateTo('/login')">
        Login
      </button>

      <!-- Authenticated: show avatar / profile menu -->
      <button *ngIf="auth.isAuthenticated" class="user-profile-btn" title="User Profile" (click)="toggleProfileMenu()">
        <img *ngIf="auth.user?.avatar" [src]="auth.user?.avatar" class="profile-img" />
        <svg *ngIf="!auth.user?.avatar" cdsIcon="user--avatar" size="20" class="profile-svg"></svg>
      </button>
      <div *ngIf="isProfileMenuOpen && auth.isAuthenticated" class="profile-dropdown">
        <div class="profile-info">
          <p class="profile-name">{{ auth.user?.name }}</p>
          <p class="profile-email">{{ auth.user?.email }}</p>
        </div>
        <div class="dropdown-divider"></div>
        <button class="logout-btn" (click)="logout()">
          Logout
        </button>
      </div>
    </div>

    <!-- Theme Toggle -->
    <button
      type="button"
      class="cds--header__action app-theme-toggle"
      [attr.aria-label]="isDark ? 'Switch to Light Theme' : 'Switch to Dark Theme'"
      [title]="isDark ? 'Switch to Light Theme' : 'Switch to Dark Theme'"
      (click)="toggleTheme()">
      <span style="font-size: 1rem; padding: 0 8px;">{{ isDark ? '☀️' : '🌙' }}</span>
    </button>
  </cds-header-global>
</cds-header>

<!-- Header Panel for Workspace Switcher -->


<!-- IBM Carbon Sidenav -->
<cds-sidenav [expanded]="sidenavExpanded" [rail]="true" *ngIf="currentRoute !== '/login'" data-carbon-theme="g100">

  <cds-sidenav-item (click)="navigateTo('/')" [active]="currentRoute === '/'">
    <svg icon cdsIcon="dashboard" size="16"></svg>
    Dashboard
  </cds-sidenav-item>

  <div class="cds--side-nav__divider"></div>
  <h2 class="cds--side-nav__heading"
    style="padding-left: 1rem; padding-top: 1rem; padding-bottom: 0.5rem; font-size: 0.75rem; text-transform: uppercase; color: var(--cds-text-secondary, #a8a8a8); letter-spacing: 0.08rem;">
    Workspace</h2>

  <cds-sidenav-item (click)="navigateTo('/tools')" [active]="isActiveRoute('/tools')">
    <svg icon cdsIcon="api" size="16"></svg>
    Tool Registry
  </cds-sidenav-item>

  <cds-sidenav-item (click)="navigateTo('/neural-router')" [active]="isActiveRoute('/neural-router')">
    <svg icon cdsIcon="machine-learning-model" size="16"></svg>
    NeuralToolRouter
  </cds-sidenav-item>

  <cds-sidenav-item (click)="navigateTo('/agents')" [active]="isActiveRoute('/agents')">
    <svg icon cdsIcon="bot" size="16"></svg>
    Agent Studio
  </cds-sidenav-item>

  <cds-sidenav-item (click)="navigateTo('/orchestrator')" [active]="isActiveRoute('/orchestrator')">
    <svg icon cdsIcon="flow--data" size="16"></svg>
    Orchestrator
  </cds-sidenav-item>

  <cds-sidenav-item (click)="navigateTo('/playground')" [active]="isActiveRoute('/playground')">
    <svg icon cdsIcon="play" size="16"></svg>
    Playground
  </cds-sidenav-item>

  <div class="cds--side-nav__divider"></div>
  <h2 class="cds--side-nav__heading"
    style="padding-left: 1rem; padding-top: 1rem; padding-bottom: 0.5rem; font-size: 0.75rem; text-transform: uppercase; color: var(--cds-text-secondary, #a8a8a8); letter-spacing: 0.08rem;">
    Pipeline</h2>

  <cds-sidenav-item (click)="navigateTo('/workflow')" [active]="isActiveRoute('/workflow')">
    <svg icon cdsIcon="flow--data" size="16"></svg>
    Workflow
  </cds-sidenav-item>

  <div class="cds--side-nav__divider"></div>
  <h2 class="cds--side-nav__heading"
    style="padding-left: 1rem; padding-top: 1rem; padding-bottom: 0.5rem; font-size: 0.75rem; text-transform: uppercase; color: var(--cds-text-secondary, #a8a8a8); letter-spacing: 0.08rem;">
    Administration</h2>

  <cds-sidenav-item (click)="navigateTo('/settings')" [active]="isActiveRoute('/settings')">
    <svg icon cdsIcon="settings" size="16"></svg>
    Settings
  </cds-sidenav-item>

  <!-- Workspace Section at Bottom -->
  <div class="cds--side-nav__divider" style="margin-top: auto;"></div>
  <div class="ws-quick-switch" *ngIf="sidenavExpanded">
    <h2 class="cds--side-nav__heading"
      style="padding-left: 1rem; padding-top: 0.75rem; padding-bottom: 0.25rem; font-size: 0.6875rem; text-transform: uppercase; color: var(--cds-text-helper, #6f6f6f); letter-spacing: 0.08rem;">
      Workspaces</h2>
    <div class="ws-list">
      <div *ngFor="let ws of workspaces"
           class="ws-item"
           [class.active]="activeWorkspace?.id === ws.id"
           (click)="selectWorkspace(ws)">
        <span class="ws-dot" [class.active]="activeWorkspace?.id === ws.id"></span>
        <span class="ws-name">{{ ws.name }}</span>
      </div>
      <div class="ws-item ws-add" (click)="openNewWorkspaceModal()">
        <svg cdsIcon="add" size="16"></svg>
        <span>New Workspace</span>
      </div>
    </div>
  </div>

</cds-sidenav>

<!-- Overlay to close side panel when clicking outside -->
<div *ngIf="sidenavExpanded" class="sidenav-overlay" (click)="closeSidenav()"></div>

<!-- Main Content Area -->
<div class="cds--content" [ngClass]="isDark ? 'cds--g100' : 'cds--white'" style="height: 100vh; overflow-y: auto;">
  <!-- Notifications area -->
  <div class="notifications-container" style="position: fixed; top: 3rem; right: 1rem; z-index: 9999; display: flex; flex-direction: column; gap: 0.5rem;">
    <cds-inline-notification
      *ngFor="let notification of notifications"
      [notificationObj]="{
        type: notification.type,
        title: notification.title,
        message: notification.message,
        showClose: true
      }"
      (close)="onNotificationClosed(notification)">
    </cds-inline-notification>
  </div>

  <!-- Router Outlet for all routes -->
  <router-outlet></router-outlet>
</div>

<!-- Placeholder for Carbon modals -->
<ibm-placeholder></ibm-placeholder>

<!-- New Workspace Modal -->
<cds-modal [open]="showWorkspaceModal" (overlaySelected)="closeWorkspaceModal()" size="sm">
  <cds-modal-header (closeSelect)="closeWorkspaceModal()">
    <h3 cdsModalHeaderHeading>Create Workspace</h3>
  </cds-modal-header>
  <section cdsModalContent>
    <div style="display: flex; flex-direction: column; gap: 1rem; padding: 0.5rem 0;">
      <div class="cds--form-item">
        <label class="cds--label">Workspace Name *</label>
        <input class="cds--text-input" type="text" [(ngModel)]="newWorkspaceName" placeholder="e.g. Banking Agents" />
      </div>
      <div class="cds--form-item">
        <label class="cds--label">Description</label>
        <textarea class="cds--text-area workspace-description-textarea" rows="6" [(ngModel)]="newWorkspaceDesc" placeholder="Optional description..."></textarea>
      </div>
    </div>
  </section>
  <cds-modal-footer>
    <button class="cds--btn cds--btn--secondary" (click)="closeWorkspaceModal()">Cancel</button>
    <button class="cds--btn cds--btn--primary" (click)="createWorkspace()" [disabled]="!newWorkspaceName.trim()">Create</button>
  </cds-modal-footer>
</cds-modal>
